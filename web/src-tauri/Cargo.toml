[package]
name = "image-ocr-to-excel"
version = "0.1.0"
description = "Create OCR templates for fixed-format images and export folder batches to Excel."
authors = ["Image OCR to Excel"]
edition = "2021"

[lib]
name = "image_ocr_to_excel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
